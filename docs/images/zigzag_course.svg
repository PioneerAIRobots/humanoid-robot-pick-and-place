<svg viewBox="0 0 1000 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica,Arial,sans-serif">
  <rect x="0" y="0" width="1000" height="420" fill="#ffffff"/>
  <text x="500" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#111827">Zig-Zag Obstacle Course - Planned vs. Executed Path (top-down, odom frame)</text>

  <!-- axes -->
  <g stroke="#9ca3af" stroke-width="1">
    <line x1="60" y1="210" x2="960" y2="210"/>
  </g>
  <text x="960" y="230" font-size="12" fill="#6b7280" text-anchor="end">+x (8 m to goal)</text>
  <text x="40" y="100" font-size="12" fill="#6b7280">+y</text>

  <!-- obstacles: x in [0,8]m mapped to [80,940]px, y in [-1,1]m mapped to [210-150*y] -->
  <g fill="#f97316" opacity="0.9">
    <rect x="195" y="155" width="36" height="36"/>
    <rect x="325" y="245" width="36" height="36"/>
    <rect x="455" y="155" width="36" height="36"/>
    <rect x="585" y="245" width="36" height="36"/>
    <rect x="715" y="155" width="36" height="36"/>
  </g>
  <g font-size="11" fill="#7c2d12" text-anchor="middle">
    <text x="213" y="150">obs 1 (1.6, 0.55)</text>
    <text x="343" y="300">obs 2 (2.9,-0.55)</text>
    <text x="473" y="150">obs 3 (4.2, 0.55)</text>
    <text x="603" y="300">obs 4 (5.5,-0.55)</text>
    <text x="733" y="150">obs 5 (6.8, 0.55)</text>
  </g>

  <!-- planned path (green dashed), approximating the real A* waypoints -->
  <polyline points="85,207 248,231 378,180 508,216 638,180 768,216 898,207"
            fill="none" stroke="#16a34a" stroke-width="3" stroke-dasharray="8,6"/>

  <!-- executed trajectory (blue solid), real TF-tracked run -->
  <path d="M85,207 C180,208 210,235 248,228 C300,218 340,185 378,183 C440,180 470,220 508,213 C560,205 600,183 638,183 C700,183 730,220 768,213 C820,205 860,207 898,208"
        fill="none" stroke="#2563eb" stroke-width="3"/>

  <!-- start / goal -->
  <circle cx="85" cy="207" r="7" fill="#111827"/>
  <text x="85" y="235" text-anchor="middle" font-size="12" fill="#111827">start (0,0)</text>
  <circle cx="898" cy="207" r="7" fill="#dc2626"/>
  <text x="898" y="235" text-anchor="middle" font-size="12" fill="#dc2626">goal (8,0)</text>

  <!-- legend -->
  <g font-size="13">
    <line x1="700" y1="360" x2="740" y2="360" stroke="#16a34a" stroke-width="3" stroke-dasharray="8,6"/>
    <text x="748" y="365" fill="#111827">A* planned path</text>
    <line x1="700" y1="385" x2="740" y2="385" stroke="#2563eb" stroke-width="3"/>
    <text x="748" y="390" fill="#111827">actual walked trajectory (TF)</text>
  </g>
  <text x="60" y="405" font-size="11" fill="#6b7280">Data from a live run: final position (7.90, 0.02) vs goal (8.0, 0.0) - "Goal reached." logged by navigate_to_goal.</text>
</svg>
